<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple Euro to Saudi Riyal converter.">
  <title>EUR to SAR</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="converter" aria-labelledby="title">
    <header class="header">
      <p class="eyebrow">Currency converter</p>
      <h1 id="title">EUR <span aria-hidden="true">↔</span> SAR</h1>
      <p class="subtitle">Euro to Saudi Riyal</p>
    </header>

    <form class="converter-form" novalidate>
      <label class="currency-field" for="eur">
        <span class="currency-label"><span class="flag" aria-hidden="true">🇪🇺</span> Euro <small>EUR</small></span>
        <span class="input-wrap"><span class="currency-symbol" aria-hidden="true">€</span><input id="eur" name="eur" type="text" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Amount in euros"></span>
      </label>

      <div class="swap" aria-hidden="true">⇅</div>

      <label class="currency-field" for="sar">
        <span class="currency-label"><span class="flag" aria-hidden="true">🇸🇦</span> Saudi Riyal <small>SAR</small></span>
        <span class="input-wrap"><span class="currency-symbol" aria-hidden="true">⃁</span><input id="sar" name="sar" type="text" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Amount in Saudi riyals"></span>
      </label>
    </form>

    <p class="rate">1 EUR = 4.1500 SAR</p>
  </main>
</body>
</html>
